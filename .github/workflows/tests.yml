name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install ruff pytest pytest-asyncio pytest-aiohttp aiohttp
      - run: ruff format --check .
      - run: ruff check .
      - run: pytest
